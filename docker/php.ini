; DCP Pragati PHP overrides
memory_limit = 256M
upload_max_filesize = 4M
post_max_size = 8M
max_execution_time = 60
expose_php = Off
date.timezone = Asia/Kolkata

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Revalidate in dev so code changes after a rebuild are picked up; production can set 0.
opcache.validate_timestamps = 1
